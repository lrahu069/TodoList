<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo-List</title>
    <link rel="stylesheet" href="styles/11-todo-list.css">
  </head>
  <body>
    <h1><u>TODO-LIST</u></h1>
    <div class="todo-input-grid">
      <input type="text" class="js-input js-add-input name-input" placeholder="Add new task">
      <input type="date" class="js-date-input js-add-input date-input">
      <input type="time" class="js-time-input js-add-input">
      <p class="task-progress">Progress</p>
      <button class="add-button js-add-button">Add</button>
    </div>
    <div class="view-task todo-grid"></div>
    <script src="scripts/11-todo-list.js"></script>
  </body>
</html>
